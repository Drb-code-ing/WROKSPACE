<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  
  <script>
    // js 灵活
    const arr = [1, 2, 3, 4, 5]
    // 如果不知道数组的元素？
    const arr1 = []// 特定的存储结构，在内存中是连续存储的空间
    arr1.push(1)// push返回新数组的长度
    arr1.push(2)
    arr1.unshift(3)// 在数组的开头添加一个元素 unshift返回新数组的长度
    arr1.pop()// 删除数组的最后一个元素 pop返回删除的元素
    arr1.shift()// 删除数组的第一个元素 shift返回删除的元素
    console.log(arr1)
  </script>
</body>
</html>
